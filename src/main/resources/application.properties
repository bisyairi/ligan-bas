server.port=${PORT:8080}
# Behind Caddy/Nginx on the same host: trust X-Forwarded-* from loopback/private proxies only
server.forward-headers-strategy=native
server.error.include-message=never

busalert.data-dir=${DATA_DIR:./data}
busalert.vapid-subject=${VAPID_SUBJECT:mailto:admin@example.com}
busalert.max-subs-total=${MAX_SUBS_TOTAL:300}
busalert.max-subs-per-ip=${MAX_SUBS_PER_IP:5}
busalert.avg-speed-kmh=${AVG_BUS_SPEED_KMH:20}

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ligan_bas}
spring.datasource.username=${DB_USER:ligan_bas}
spring.datasource.password=${DB_PASSWORD:ligan_bas}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
